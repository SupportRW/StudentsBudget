name: Nightly

# Every night on the default branch, the whole CI with nothing left out (ci.yml, called with its own inputs): a full run
# on every browser and language, which posts full-gate on the tested commit. At 02:17 UTC, off the hour, when GitHub's
# scheduler is less busy. It also starts by hand (Actions → Nightly → Run workflow). GitHub pauses a schedule in a
# public repository after 60 days with no activity in it; a push brings it back.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# The gate in ci.yml posts the run's commit status; a called workflow gets no more than its caller grants.
permissions:
  contents: read
  statuses: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      scope: full
      browsers: all
      languages: all
