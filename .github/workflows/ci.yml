name: CI

# StudentsBudget's CI, from the playwright-tester skill's CI template (itself derived from StudentsBudget's CI at 666c674).
# Filled in for this repo: npm, Node 24 (package.json's engines), the Playwright projects desktop-chrome and iphone,
# e2e/affected-map.json for the routes under src/app. The e2e build talks to a fake Supabase host
# (E2E_SUPABASE_ENV in playwright.config.ts), so no secrets are needed. Repo layers are off: this branch has no
# playwright.offline.config.ts (production build check) and no test:db/test:contract scripts (backend stack).
# - A ready pull request (never a draft) runs the quick check by itself on each push: lint, typecheck, build and unit
#   tests, plus any repo layer marked quick. No e2e.
# - e2e runs when started by hand (Actions → CI → Run workflow, or `gh workflow run ci.yml --ref <branch>`). `changed`
#   runs the specs the branch's changes reach (scripts/ci-affected.mjs follows the imports to the pages and reads
#   e2e/affected-map.json; the job summary says why each spec runs); `full` runs every spec on E2E_SHARDS machines;
#   `specs` runs only the named spec files. nightly.yml calls a full run every night.
# - The e2e machines' blob reports merge into one HTML report with traces. @quarantine tests run apart, never blocking.
#   A run started by hand also repeats the changed spec files 10 times, to catch a flaky test before it lands.
# - The gate job posts one commit status on the tested commit: full-gate (a full run on every browser and language),
#   partial-check (a narrowed full run), quick-check (a changed or quick run) or spec-check (hand-picked specs). A job
#   the run needs that was skipped, cancelled or failed makes it a failure.
# Settings: the env block below and each job's timeout-minutes (`setting`). Actions are pinned to commit SHAs (checkout
# v7.0.1, setup-node v7.1.0, upload-artifact v7.0.2, download-artifact v8.0.2); to update one, change every line of it.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed: what the branch changes against main. full: everything, and the full-gate status'
        type: choice
        options: [changed, full]
        default: changed
      browsers:
        description: 'auto: Chromium for changed, every Playwright project for full'
        type: choice
        options: [auto, chromium, all]
        default: auto
      languages:
        description: 'auto: the default language for changed, every language for full (the specs read E2E_LANGUAGES)'
        type: choice
        options: [auto, default, all]
        default: auto
      specs:
        description: 'only these e2e spec files, by name (smoke.spec.ts settings.spec.ts), and nothing else'
        type: string
        default: ''
  # nightly.yml calls this workflow with its own inputs, the same as Run workflow's.
  workflow_call:
    inputs:
      scope: { type: string, default: changed }
      browsers: { type: string, default: auto }
      languages: { type: string, default: auto }

permissions:
  contents: read

# A new run on the same branch and scope stops the one before; a changed run never stops a full one. In a call the
# workflow's name is the caller's, so the nightly and a full run by hand never stop each other. A draft's run (which runs
# nothing) has a group of its own: a pull request opened as a draft and marked ready at once can have its `opened` event
# arrive after Ready for review, and in the same group it would stop the real quick check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope }}${{ inputs.specs && '-specs' || '' }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

env:
  # setting: the Node version the repo builds with (package.json's engines: 24.x).
  NODE_VERSION: '24'
  # setting: the Ubuntu of Playwright's image (noble is 24.04; resolute, 26.04, exists for newer Playwright versions).
  PLAYWRIGHT_DISTRO: noble
  # setting: the machines a run of every spec is split over.
  E2E_SHARDS: '4'

jobs:
  # What this run needs (scripts/ci-affected.mjs says what each output holds), the commit every later job checks out,
  # and the Playwright image of the lockfile's version.
  changes:
    # A draft runs nothing: the person is still working on it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10 # setting
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      image: ${{ steps.playwright.outputs.image }}
      run: ${{ steps.affected.outputs.run }}
      e2e: ${{ steps.affected.outputs.e2e }}
      shards: ${{ steps.affected.outputs.shards }}
      projects: ${{ steps.affected.outputs.projects }}
      languages: ${{ steps.affected.outputs.languages }}
      repeat: ${{ steps.affected.outputs.repeat }}
      layers: ${{ steps.affected.outputs.layers }}
      jobs: ${{ steps.affected.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the selection diffs against main from where the branch left it.
          fetch-depth: 0
      - id: head
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # npm's lockfile: @playwright/test's version picks the image. A version
      # missing from the lockfile fails here, not as an image that doesn't exist.
      - id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "image=mcr.microsoft.com/playwright:v$version-$PLAYWRIGHT_DISTRO" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The selection's own tests first, with the map's: a broken selection must fail the run, not pick too little.
      # Node's built-ins only, so no npm ci.
      - run: node --test scripts/ci-affected.test.mjs
      - id: affected
        env:
          # A pull request's own run is `quick`: `changed` without e2e.
          CI_SCOPE: ${{ github.event_name == 'pull_request' && 'quick' || inputs.scope }}
          CI_BROWSERS: ${{ inputs.browsers }}
          CI_LANGUAGES: ${{ inputs.languages }}
          CI_SPECS: ${{ inputs.specs }}
        run: node scripts/ci-affected.mjs

  # Lint, typecheck, build and the whole unit suite, in every run but a notes-only one or a run of hand-picked specs.
  checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # setting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The repo's own commands (CLAUDE.md, Commands).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The whole unit suite, never only the changed tests: those miss changed fixtures, configs and the lockfile.
      - run: npm test
      # The workflows themselves: expressions, contexts, job outputs and needs, and their shell scripts. Optional.
      - run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # The picked specs on one machine, or every spec in E2E_SHARDS shards, in Playwright's image (every browser and its
  # libraries, nothing from the slow Ubuntu mirror). uid 1001 owns the workspace, as in Playwright's CI docs.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.image }}
      options: --user 1001
    timeout-minutes: 30 # setting
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - env:
          SPECS: ${{ needs.changes.outputs.e2e }}
          SHARD: ${{ matrix.shard }}
          PROJECTS: ${{ needs.changes.outputs.projects }}
          # `default` or `all`; what the specs do with it is the repo's (CHECKLIST.md, "Languages").
          E2E_LANGUAGES: ${{ needs.changes.outputs.languages }}
        # $SPECS and $PROJECTS stay unquoted: each spec is an argument of its own, and no projects means every project.
        # A quarantined test runs in the quarantine job instead, where it doesn't block.
        run: |
          # shellcheck disable=SC2086
          if [ "$SPECS" = all ]; then
            npx playwright test $PROJECTS --grep-invert @quarantine --shard="$SHARD" --reporter=dot,blob
          else
            npx playwright test $PROJECTS $SPECS --grep-invert @quarantine --reporter=dot,blob
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 1

  # One HTML report for the e2e run, with each failed test's trace, merged from every machine's blob report.
  e2e-report:
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # setting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The quarantined tests (`@quarantine`, each with its owner and fix-by date), apart and never blocking: the gate
  # doesn't wait for this job, and a failure here is a note on the run, not a red run.
  quarantine:
    needs: changes
    if: needs.changes.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.image }}
      options: --user 1001
    continue-on-error: true
    timeout-minutes: 20 # setting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - env:
          PROJECTS: ${{ needs.changes.outputs.projects }}
          E2E_LANGUAGES: ${{ needs.changes.outputs.languages }}
        # $PROJECTS stays unquoted: no projects means every project.
        run: |
          # shellcheck disable=SC2086
          npx playwright test $PROJECTS --grep @quarantine --pass-with-no-tests --reporter=dot

  # The repeat check, in runs by hand: the changed spec files 10 times at 2 workers, no retries, stopping at the first
  # failure. A test that fails once in ten is flaky. Mocked specs only: one that needs a backend layer repeats there.
  repeat:
    needs: changes
    if: needs.changes.outputs.repeat != ''
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.image }}
      options: --user 1001
    timeout-minutes: 60 # setting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - env:
          SPECS: ${{ needs.changes.outputs.repeat }}
          PROJECTS: ${{ needs.changes.outputs.projects }}
          E2E_LANGUAGES: ${{ needs.changes.outputs.languages }}
        # $PROJECTS and $SPECS stay unquoted: no projects means every project; each spec is an argument of its own.
        run: |
          # shellcheck disable=SC2086
          npx playwright test $PROJECTS $SPECS --repeat-each=10 --workers=2 --max-failures=1 --retries=0 --grep-invert @quarantine

  # ═══ Repo layers, off until the repo fills one in (CHECKLIST.md, "Repo layers"): uncomment the job, add its name to
  # the gate's needs, and add its entry to LAYERS in scripts/ci-affected.mjs (the unit tests hold the two equal).

  # ── repo layer: backend stack ──
  # A backend the tests need (a database, an auth server, an API), on the runner. The repo supplies: the ports its
  # services bind, reserved first (an outgoing connection from a later step could take one: "address already in use"),
  # a start command, an env script that prints KEY=value lines, a seed, and the tests against it. If the e2e specs
  # need the backend, start it in the e2e job instead, before `playwright test`.
  # stack:
  #   needs: changes
  #   if: contains(fromJSON(needs.changes.outputs.layers), 'stack')
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 40 # setting
  #   steps:
  #     - run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=<first port>-<last port>
  #     - (checkout, setup-node and npm ci, as in the checks job)
  #     - run: npm run <start the stack>
  #     - run: |
  #         node <scripts/stack-env.mjs> >> "$GITHUB_ENV"
  #     - run: npm run <seed>
  #     - run: npm run <backend tests>

  # ── repo layer: production build check ──
  # What only a production build shows (a service worker, offline pages, a static export, security headers), through
  # a Playwright config of its own that builds and starts the app. The repo supplies: that config and the command, and
  # the paths it depends on (LAYERS, with `allSpecs: true`, so a run of every spec runs it too).
  # production:
  #   needs: changes
  #   if: contains(fromJSON(needs.changes.outputs.layers), 'production')
  #   runs-on: ubuntu-latest
  #   container:
  #     image: ${{ needs.changes.outputs.image }}
  #     options: --user 1001
  #   timeout-minutes: 20 # setting
  #   steps:
  #     - (checkout, setup-node and npm ci, as in the e2e job)
  #     - run: npx playwright test -c <playwright.production.config.ts>

  # ── repo layer: random clicker ──
  # A seeded random walk that fails on a crash, a console error or a 5xx answer; long, so `full: false` in LAYERS (only
  # a change to its own files turns it on). The repo supplies: its spec and config outside the spec folder (files in
  # NO_E2E), the walk's length, and where it writes the steps that replay a walk (uploaded `if: always()`). To start it
  # by hand or nightly, add a `monkey` input (yes/no) to workflow_dispatch and workflow_call, `|| inputs.monkey == 'yes'`
  # to the job's `if:`, and `monkey: 'yes'` to nightly.yml.
  # monkey:
  #   needs: changes
  #   if: contains(fromJSON(needs.changes.outputs.layers), 'monkey')
  #   runs-on: ubuntu-latest
  #   container:
  #     image: ${{ needs.changes.outputs.image }}
  #     options: --user 1001
  #   timeout-minutes: 45 # setting
  #   steps:
  #     - (checkout, setup-node and npm ci, as in the e2e job)
  #     - run: npx playwright test -c <playwright.monkey.config.ts> --workers=1

  # The run's one verdict, a commit status on the tested commit, where a pull request shows it (a run by hand's check runs
  # don't appear there). `node scripts/ci-affected.mjs verdict` reads every result itself: a job its `if:` skips would
  # otherwise count as passed. Keep `needs` on one line: the unit tests hold it equal to JOBS.
  gate:
    needs: [changes, checks, e2e, e2e-report, repeat]
    # Not for a draft, whose run was skipped on purpose.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5 # setting
    permissions:
      contents: read
      statuses: write
    env:
      # The commit `changes` checked out; the run's own commit when `changes` failed before it knew.
      SHA: ${{ needs.changes.outputs.sha || github.sha }}
    steps:
      # Only the script, from the tested commit: the verdict needs Node's built-ins and nothing from npm.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          # A pull request's own run is `quick`, as in `changes`.
          CI_SCOPE: ${{ github.event_name == 'pull_request' && 'quick' || inputs.scope }}
          CI_BROWSERS: ${{ inputs.browsers }}
          CI_LANGUAGES: ${{ inputs.languages }}
          CI_SPECS: ${{ inputs.specs }}
        run: node scripts/ci-affected.mjs verdict
      - env:
          GH_TOKEN: ${{ github.token }}
          # A pull request shows statuses on its head commit, not on the merge commit its run checks out and tests.
          STATUS_SHA: ${{ github.event.pull_request.head.sha || env.SHA }}
          CONTEXT: ${{ steps.verdict.outputs.context }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" -f state="$STATE" -f context="$CONTEXT" \
            -f target_url="$RUN_URL" -f description="$DESCRIPTION" > /dev/null
          echo "Posted $CONTEXT: $STATE on $STATUS_SHA." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$STATE" = success ]
